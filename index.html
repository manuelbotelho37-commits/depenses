  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{margin:0; min-height:100vh; color:var(--text); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);}
  h1,h2,.serif{font-family:'Fraunces',serif; font-weight:600;}
  .wrap{max-width:640px; margin:0 auto; padding:0 16px calc(150px + env(safe-area-inset-bottom,0px));}
  input,select,textarea{width:100%; padding:14px; background:var(--surface2); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:1rem; font-family:inherit;}

  label{display:block; font-size:.8rem; color:var(--dim); margin:14px 0 6px;}

  .primary{background:var(--brass); color:#1a1508; border-color:var(--brass); font-weight:600;}
  .danger{color:var(--red); border-color:#5a2f2b;}
  .err{color:var(--red); font-size:.88rem; min-height:1.2em; margin-top:10px;}

  header{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:20px 0 10px; position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5;}
  header h1{margin:0; font-size:1.7rem; display:flex; align-items:center; gap:6px;}

  .monthnav{display:flex; align-items:center; gap:4px;}
  .monthnav button{padding:8px 12px; font-size:1.1rem; line-height:1; background:transparent; border-color:transparent; color:var(--brass2);}
  .monthnav b{min-width:118px; text-align:center; font-weight:600; font-size:.95rem; text-transform:capitalize;}

  .hero{background:linear-gradient(145deg,#232a33 0%,#1a1f26 60%,#2a2414 140%); border:1px solid #4a3f22; border-radius:18px; padding:20px 18px; margin-top:8px; position:relative; overflow:hidden;}
  .hero small{color:var(--dim); font-size:.8rem; text-transform:uppercase; letter-spacing:.08em;}
  .hero .big{font-family:'Fraunces',serif; font-size:2.6rem; font-weight:600; color:var(--brass2); margin:4px 0 2px; font-variant-numeric:tabular-nums;}
  .hero .sub{color:var(--dim); font-size:.88rem;}
  .bar{height:8px; background:#0f1317; border-radius:6px; overflow:hidden; margin-top:14px;}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--brass),var(--brass2)); border-radius:6px;}
  .bar.over i{background:var(--red);}
  .duo{display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:start;}
  .duoc{cursor:pointer;}
  .duo .sep{width:1px; align-self:stretch; background:#4a3f22;}
  .duo .big{font-size:1.9rem; margin:6px 0 0;}
  .duo .mini{color:var(--dim); font-size:.74rem; margin-top:2px;}
  .duo + .sub{margin-top:14px;}
  .amtwrap{position:relative;}
  .amtwrap .amountin{padding-right:120px; text-align:left; padding-left:18px;}
  .pay{position:absolute; right:6px; top:50%; transform:translateY(-50%); display:flex; gap:4px;}
  .pay button{display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 8px; font-size:.66rem; color:var(--dim); border-radius:9px; background:var(--surface);}

  .pay button.on{border-color:var(--brass); background:#2a2414; color:var(--brass2);}
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}

  .tile small{display:block; color:var(--dim); font-size:.72rem;}
  .tile b{display:block; font-size:1.05rem; margin-top:4px; font-variant-numeric:tabular-nums; white-space:nowrap;}

  .ttl > span{display:block; color:var(--dim); font-size:.8rem; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .amt{font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .tag{display:inline-block; font-size:.68rem; padding:2px 7px; border-radius:10px; border:1px solid #4a3f22; color:var(--brass2); margin-left:6px; vertical-align:1px;}

  .empty{text-align:center; color:var(--dim); padding:40px 12px; font-size:.95rem; line-height:1.5;}

  .catrow{padding:12px 14px;}

  .catrow .top .ttl b{font-size:.95rem;}
  .catrow .bar{margin-top:8px; height:6px;}

  .fab{position:fixed; right:18px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); background:var(--brass); color:#1a1508; border:none; font-weight:700; padding:16px 22px; border-radius:30px; box-shadow:0 6px 20px rgba(0,0,0,.5); z-index:6;}
  nav.tabs{position:fixed; left:0; right:0; bottom:0; background:rgba(16,19,23,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line); display:flex; justify-content:center; z-index:7; padding-bottom:env(safe-area-inset-bottom,0px);}

  nav.tabs button svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:flex-end; justify-content:center; z-index:20;}

  .seg{display:flex; background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:4px; margin-top:14px;}

  .ncbox{margin-top:10px; padding:14px; border:1px solid #4a3f22; border-radius:12px; background:#1a1f26;}
  .emos{display:grid; grid-template-columns:repeat(8,1fr); gap:6px;}

  .emos button.on{border-color:var(--brass); background:#2a2414;}

  .quick button.on{border-color:var(--brass); background:#2a2414; color:var(--brass2);}
  .chk{flex:none; width:16px; height:16px; padding:0; border-radius:3.5px; border:1.25px solid #6b5823; background:transparent; color:#1a1508; font-weight:800; font-size:.6rem; line-height:1; display:flex; align-items:center; justify-content:center;}

  .chk.locked{opacity:.55;}
  .row.lockedrow{cursor:pointer;}

  .chkw{display:flex; align-items:center; gap:2px; flex:none; margin-right:-2px;}
  .lk{display:flex; align-items:center; justify-content:center; width:26px; height:32px; padding:0; border:0; background:none!important; flex:none;}
  .lk.closed{color:#d0695e;}
  .lk.open{color:#3ddc84;}
  .lk svg{width:21px; height:21px; fill:currentColor; stroke:currentColor; stroke-width:2; stroke-linecap:round;}

  .toast{position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#0c0f13; border:1px solid var(--line); padding:12px 18px; border-radius:24px; font-size:.9rem; z-index:30; max-width:90%; text-align:center;}

  .setbtn small{display:block; color:var(--dim); font-size:.78rem; margin-top:3px;}
  .hint{color:var(--dim); font-size:.82rem; line-height:1.45; margin-top:8px;}
.bkban{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:14px 14px 14px 16px;border-radius:16px;border:1px solid #c89b3c;background:linear-gradient(135deg,#3a2f17,#1d1a14)}.bkban div{flex:1;min-width:0}.bkban b{display:block;color:#f3d98f;font-size:15px}.bkban span{display:block;color:#cdbf9c;font-size:13px;margin-top:3px;line-height:1.35}.bkban button{flex:none;border:0;border-radius:12px;padding:11px 14px;background:linear-gradient(135deg,#f3d98f,#c89b3c 60%,#a7782a);color:#14181d;font:700 14px Inter,sans-serif;cursor:pointer}
.instbtn{display:block;width:100%;margin:0 0 14px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#f3d98f,#c89b3c 60%,#a7782a);color:#14181d;font:700 17px Inter,sans-serif;box-shadow:0 6px 18px #0006;cursor:pointer}
</style>

    const gx=g.filter(e=>e.kind!=='inc'), gi=g.filter(e=>e.kind==='inc');
    return `<div class="day"><div class="dayh"><span>${esc(lab)}</span><b>${gx.length?fmt(sum(gx)):''}${gx.length&&gi.length?' · ':''}${gi.length?'<span style="color:var(--green)">+'+fmt(sum(gi))+'</span>':''}</b></div><div class="card">${gx.map(rowHtml).join('')}${gi.map(incRow).join('')}</div></div>`;
  }).join('');
  return hero+tiles+todoHtml+incHtml(cur)+stmHtml(cur)+impBtnHtml()+list;
}
function impBtnHtml(){

const IMPINPUT='<input id="impfile" type="file" accept=".pdf,application/pdf,.csv,.txt,.xlsx,.xls,.ods,.ofx,.qfx,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple style="display:none" onchange="onImportFile(this)">';
const TYPE_L={cb:'💳 Carte',esp:'🪙 Espèces',prlv:'🔁 Prélèvement',vir:'↗️ Virement',retrait:'🏧 Retrait',frais:'🏦 Frais bancaires'};
function expType(e){ return (e.k&&TYPE_L[e.k]&&e.k!=='cb')?e.k:(e.p==='esp'?'esp':'cb'); }
function payLbl(e){ return e.kind==='exp'?' · '+TYPE_L[expType(e)]+(e.rec?' ✓ prévu':''):(e.done?' · 🔁 Prélèvement ✓':' · 🔁 Prélèvement à venir'); }
function detailSheet(title,sub,list,empty,byDay,todo){
  const tot=sum(list), row=e=>{const c=catOf(e.c);return `<div class="row" onclick="${e.kind==='exp'?`expTap('${e.id}')`:`closeModal(); setTab('rec')`}"><div class="ico">${c.i}</div><div class="ttl"><b>${esc(e.n||c.l)}</b><span>${!todo?'':esc(new Date(e.d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}))+' · '}${esc(c.l)}${payLbl(e)}</span></div><div class="amt">−${fmt(e.a)}</div></div>`;};
  let body='';
  if(!list.length) body=`<div class="empty" style="padding:24px 8px">${empty}</div>`;
  else if(byDay){
    const g={}; list.forEach(e=>{(g[e.d]=g[e.d]||[]).push(e);});
    body=Object.keys(g).sort().reverse().map(d=>`<div class="day" style="margin-top:10px"><div class="dayh"><span>${esc(new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}</span><b>${fmt(sum(g[d]))}</b></div><div class="card">${g[d].map(row).join('')}</div></div>`).join('');
  } else body=`<div class="card">${list.map(row).join('')}</div>`;
  const bt={}; list.forEach(e=>{ const k=e.kind==='exp'?expType(e):'prlv'; bt[k]=(bt[k]||0)+e.a; });
  const split=list.length&&!todo?`<div class="card" style="margin-top:6px">${['cb','prlv','vir','retrait','frais','esp'].filter(k=>bt[k]).map(k=>`<div class="row" style="cursor:default"><div class="ttl"><b>${TYPE_L[k]}</b><span>${list.filter(e=>(e.kind==='exp'?expType(e):'prlv')===k).length} opération(s)</span></div><div class="amt">−${fmt(bt[k])}</div></div>`).join('')}</div>`:'';
  openModal(`<h2>${esc(title)}</h2><div class="hint" style="margin-top:2px">${esc(sub)}</div>
    <div class="amountin" style="padding:10px 0 4px; text-align:left">${fmt(tot)}</div>${split}${list.length&&!todo?'<div class="hint" style="margin:14px 0 0">Le détail, jour par jour :</div>':''}${body}

function showTodo(){ const list=monthEntries(cur).filter(e=>e.kind==='rec'&&!e.done).sort((a,b)=>a.d.localeCompare(b.d)); detailSheet('Reste à payer', 'Prélèvements pas encore réglés en '+monthLabel(cur), list, '✓ Tout est réglé ce mois-ci.', false, true); }
function expTap(id){ const e=data.exp.find(x=>x.id===id); if(!e) return; if(e.src==='imp') showExp(id); else editExp(id); }

function viewRec(){

  if(old.length) h+=`<div class="sec"><h2>Arrêtés</h2></div><div class="card">${old.map(r=>{const c=catOf(r.c);return `<div class="row" onclick="editRec('${r.id}')" style="opacity:.6"><div class="ico">${c.i}</div><div class="ttl"><b>${esc(r.n||c.l)}</b><span>Dernier en ${esc(monthLabel(r.to))}</span></div><div class="amt">−${fmt(r.a)}</div></div>`;}).join('')}</div>`;
  return h;
}

function viewStats(){
  const all=monthEntries(cur), total=sum(all);
  const by={}; all.forEach(e=>{ by[e.c]=(by[e.c]||0)+e.a; });
  const keys=Object.keys(by).sort((a,b)=>by[b]-by[a]), max=keys.length?by[keys[0]]:1;
  const [y,mo]=cur.split('-').map(Number);
  const prevM=ym(new Date(y,mo-2,1)), prev=sum(monthEntries(prevM));
  const diff=total-prev;
  let h=`<div class="hero"><small>Total du mois</small><div class="big">${fmt(total)}</div><div class="sub">${prev?(diff>=0?'+':'−')+fmt(Math.abs(diff))+' par rapport à '+esc(monthLabel(prevM)):'Pas de données le mois précédent'}</div></div>`;
  if(!keys.length) return h+`<div class="empty">Rien à analyser pour ce mois.</div>`;
  h+=`<div class="sec"><h2>Par catégorie</h2></div><div class="card">${keys.map(k=>{const c=catOf(k), v=by[k];return `<div class="catrow"><div class="top"><div class="ico">${c.i}</div><div class="ttl"><b>${esc(c.l)}</b><span>${Math.round(v/total*100)} % du mois</span></div><div class="amt">${fmt(v)}</div></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`;}).join('')}</div>`;
  // 6 derniers mois
  const months=[]; for(let i=5;i>=0;i--){ const m=ym(new Date(y,mo-1-i,1)); months.push([m,sum(monthEntries(m))]); }
  const mx=Math.max(1,...months.map(x=>x[1]));
  h+=`<div class="sec"><h2>6 derniers mois</h2></div><div class="card">${months.map(([m,v])=>`<div class="catrow"><div class="top"><div class="ttl"><b style="text-transform:capitalize">${esc(new Date(m+'-01T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'}))}</b></div><div class="amt"${m===cur?' style="color:var(--brass2)"':''}>${fmt(v)}</div></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join('')}</div>`;
  return h;
}

    const diff=(new Date(d+'T12:00:00')-new Date(c+'T12:00:00'))/864e5; if(diff>=0&&diff<=10) return c; g.lastIndex=m.index+1; }

function impKind(l,type){

function impNum(v){
  if(v==null||v==='') return NaN; if(typeof v==='number') return v;
  let s=String(v).replace(/[\s €]|EUR/gi,'');
  let neg=/^\(.*\)$/.test(s)||/-$/.test(s); s=s.replace(/[()]/g,'').replace(/-$/,'');
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,'');
  const n=parseFloat(s); return isFinite(n)?(neg?-Math.abs(n):n):NaN;
}
function impDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return ymd(v);
  if(typeof v==='number' && v>20000 && v<80000){ const d=new Date(Math.round((v-25569)*864e5)); return ymd(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/))){ let y=+m[3]; if(y<100) y+=2000; if(+m[2]>12) return null; return y+'-'+pad(+m[2])+'-'+pad(+m[1]); }
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})/))) return m[1]+'-'+m[2]+'-'+m[3];
  const mois={janv:1,fevr:2,mars:3,avr:4,mai:5,juin:6,juil:7,aout:8,sept:9,oct:10,nov:11,dec:12};
  if((m=normTxt(s).match(/^(\d{1,2}) ([a-z]+) (\d{4})/))){ const k=Object.keys(mois).find(k=>m[2].startsWith(k)); if(k) return m[3]+'-'+pad(mois[k])+'-'+pad(+m[1]); }
  return null;
}
function impCSV(text){
  text=text.replace(/^\ufeff/,'');
  const first=text.split(/\r?\n/).slice(0,30).join('\n');
  const cnt=c=>(first.match(new RegExp(c==='\t'?'\t':'\\'+c,'g'))||[]).length;
  const sep=[';','\t',',','|'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===sep){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.map(r=>r.map(x=>String(x).trim()));
}
function impOFX(text){
  const out=[], blocks=text.split(/<STMTTRN>/i).slice(1);
  const tag=(b,t)=>{ const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i')); return m?m[1].trim():''; };
  blocks.forEach(b=>{ const a=impNum(tag(b,'TRNAMT')); const d=impDate(tag(b,'DTPOSTED')); const lab=[tag(b,'NAME'),tag(b,'MEMO')].filter(Boolean).join(' ');
    if(d && isFinite(a)) out.push({d, a, l:lab, t:tag(b,'TRNTYPE')}); });
  return out;
}
function impRows(rows){
  rows=rows.filter(r=>r && r.some(c=>String(c==null?'':c).trim()!==''));
  const H=c=>normTxt(c==null?'':String(c));
  let hi=-1, col={};
  for(let i=0;i<Math.min(rows.length,40);i++){
    const h=rows[i].map(H);
    const d=h.findIndex(x=>/^date|date (de l )?op|started date|date operation|^dateop/.test(x)||x==='date');
    const a=h.findIndex(x=>/montant|amount|somme|^debit|debit euro|^credit/.test(x));
    if(d>=0 && a>=0){ hi=i;
      col.d=d;
      col.l=-1; for(const re of [/libelle operation/,/description/,/^label/,/^libelle$/,/libelle/,/intitule|objet|wording|nature/]){ col.l=h.findIndex(x=>re.test(x)); if(col.l>=0) break; }
      col.l2=h.findIndex(x=>/detail de l ecriture|detail/.test(x)&&!/libelle/.test(x));
      col.deb=h.findIndex(x=>/^debit|debit euro|debit \(|montant debit|sortie/.test(x));
      col.cre=h.findIndex(x=>/^credit|credit euro|credit \(|montant credit|entree/.test(x));
      col.amt=h.findIndex(x=>/^montant|amount|^somme|montant operation|montant de l operation/.test(x)&&!/debit|credit/.test(x));
      col.t=h.findIndex(x=>/^type|type operation|categorie|category/.test(x));
      col.st=h.findIndex(x=>/^state|^statut|^etat/.test(x));
      break; }
  }
  const out=[];
  if(hi>=0){
    for(const r of rows.slice(hi+1)){
      const d=impDate(r[col.d]); if(!d) continue;
      if(col.st>=0 && /revert|declin|annul|failed|pending/.test(H(r[col.st]))) continue;
      let a=NaN;
      if(col.deb>=0 || col.cre>=0){ const db=impNum(r[col.deb]), cr=impNum(r[col.cre]);
        if(isFinite(db)&&db!==0) a=-Math.abs(db); else if(isFinite(cr)&&cr!==0) a=Math.abs(cr); }
      if(!isFinite(a) && col.amt>=0) a=impNum(r[col.amt]);
      if(!isFinite(a)) continue;
      let l=col.l>=0?String(r[col.l]||''):''; if(col.l2>=0 && col.l2!==col.l && String(r[col.l2]||'').trim()) l=String(r[col.l2]);
      out.push({d, a, l, t:col.t>=0?String(r[col.t]||''):''});
    }
    return out;
  }
  // pas d'en-tête reconnu : on devine colonne par colonne
  for(const r of rows){
    const di=r.findIndex(c=>impDate(c)); if(di<0) continue;
    const nums=r.map((c,i)=>i!==di&&typeof c!=='object'&&/^[\s(+-]*[\d\s.,]+\)?\s*(€|eur)?$/i.test(String(c==null?'':c))?impNum(c):NaN);
    const ai=nums.findIndex(n=>isFinite(n)&&n!==0); if(ai<0) continue;
    const texts=r.map((c,i)=>i!==di&&i!==ai?String(c==null?'':c):'');
    const l=texts.sort((x,y)=>y.length-x.length)[0]||'';
    out.push({d:impDate(r[di]), a:nums[ai], l, t:''});
  }
  // si tous les montants sont positifs, on ne peut pas distinguer : on les traite comme des dépenses
  if(out.length && out.every(o=>o.a>0)) out.forEach(o=>o.a=-o.a);
  return out;
}

function stmHtml(m){
  const L=stmList().filter(x=>x.m===m||(x.ms||[]).includes(m)); if(!L.length) return '';
  return `<div class="card" style="margin:12px 0 4px">${L.map(x=>`<div class="row" onclick="stmShow('${x.id}','${m}')"><div class="ico">📄</div><div class="ttl"><b>${esc(x.label||'Relevé de banque')}</b><span>${esc(x.name)}</span></div><div class="amt" style="color:var(--brass2)">Voir ›</div></div>`).join('')}</div>`;
}
function stmShow(id,mm){
  const x=stmList().find(s=>s.id===id); if(!x) return; const M=mm||x.m;
  const imp=data.exp.filter(e=>e.src==='imp'&&e.d.slice(0,7)===M), inc=incList().filter(e=>e.d.slice(0,7)===M);
  openModal(`<h2>${esc(x.label||'Relevé de banque')}</h2><div class="hint" style="margin-top:2px">${esc(x.name)} · ${(x.size/1024/1024).toFixed(1).replace('.',',')} Mo</div>
    <div class="card" style="margin-top:12px"><div class="row" style="cursor:default"><div class="ttl"><span>Lignes de ${esc(monthLabel(M))} dans l'appli</span><b>${imp.length+inc.length} ligne${imp.length+inc.length>1?'s':''}</b></div></div>
    <div class="row" onclick="closeModal(); cur='${M}'; showSpent()"><div class="ttl"><span>Dépenses</span><b>${imp.length} ligne${imp.length>1?'s':''}</b></div><div class="amt">−${fmt(sum(imp))}</div></div>
    ${inc.length?`<div class="row" onclick="showInc('${M}')"><div class="ttl"><span>Entrées d'argent</span><b>${inc.length} ligne${inc.length>1?'s':''}</b></div><div class="amt" style="color:var(--green)">+${fmt(sum(inc))}</div></div>`:''}</div>
    ${chkHtml(x.chk)}
    <div class="row2" style="margin-top:14px"><button onclick="stmOpen('${x.id}','${M}')" class="primary" style="flex:2">📄 Ouvrir le relevé</button></div>
    <div class="row2"><button onclick="closeModal()">Fermer</button><button onclick="stmRename('${x.id}','${M}')">Renommer</button><button class="danger" onclick="stmDel('${x.id}')">Retirer</button></div>`);
}
function stmRename(id,M){
  const x=stmList().find(s=>s.id===id); if(!x) return;
  openModal(`<h2>Renommer le relevé</h2><div class="hint" style="margin-top:2px">Par exemple : La Banque Postale, Crédit Agricole, Revolut…</div>
    <input id="stm_n" type="text" maxlength="40" placeholder="Relevé de banque" value="${esc(x.label||'')}" style="margin-top:12px">
    <div class="row2"><button onclick="stmShow('${id}','${M}')">Annuler</button><button class="primary" onclick="stmRenameDo('${id}','${M}')">Enregistrer</button></div>`);
  setTimeout(()=>{ const i=$('#stm_n'); if(i){ i.focus(); i.select(); } },80);
}
function stmRenameDo(id,M){ const x=stmList().find(s=>s.id===id); if(!x) return; const v=$('#stm_n').value.trim(); delete x.auto; if(v) x.label=v; else delete x.label; save(); render(); stmShow(id,M); toast('✓ Relevé renommé'); }
async function stmBlob(x){ if(x.asset){ const r=await fetch('/_blob/'+x.asset); if(!r.ok) throw 0; return r.blob(); } return idbDo('readonly',o=>o.get(x.id)); }
async function stmOpen(id,M){
  const x=stmList().find(s=>s.id===id); if(!x) return;
  openModal(`<h2>${esc(x.label||'Relevé de banque')}</h2><div class="hint" style="margin-top:2px">${esc(x.name)}</div><div id="stmv" style="margin:12px -6px 0; overflow:auto"><div class="empty" style="padding:24px 8px">Ouverture du relevé…</div></div>
    <div class="row2" style="position:sticky; bottom:-18px; background:var(--surface); padding:12px 0 6px"><button onclick="stmShow('${x.id}','${M||x.m}')">‹ Retour</button><button onclick="stmZoom()">🔍 Agrandir</button></div>`);
  try{
    const b=await stmBlob(x); if(!b) throw 0; const box=$('#stmv');
    if(/\.pdf$/i.test(x.name)){
      const lib=await loadPDFJS(); const doc=await lib.getDocument({data:new Uint8Array(await b.arrayBuffer()), isEvalSupported:false}).promise;
      box.innerHTML='';
      for(let n=1;n<=doc.numPages;n++){
        const pg=await doc.getPage(n), v0=pg.getViewport({scale:1}), sc=Math.min(3,(box.clientWidth||360)*2/v0.width), vp=pg.getViewport({scale:sc});
        const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.style.cssText='width:100%; display:block; margin:0 0 8px; border-radius:6px; background:#fff';
        box.appendChild(c); await pg.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
      }
    } else { const t=await b.text(); box.innerHTML='<pre style="white-space:pre-wrap; font-size:.72rem; color:var(--text)">'+esc(t.slice(0,200000))+'</pre>'; }
  }catch(e){ const box=$('#stmv'); if(box) box.innerHTML='<div class="empty" style="padding:24px 8px">Je n\'arrive pas à ouvrir ce relevé ici.</div>'; }
}
function stmZoom(){ const box=$('#stmv'); if(!box) return; const big=!box.dataset.z; box.dataset.z=big?'1':''; box.querySelectorAll('canvas').forEach(c=>c.style.width=big?'220%':'100%'); }
function stmDel(id){
  openModal(`<h2>Retirer ce relevé ?</h2><div class="hint">Le fichier est retiré de l'appli. Tes dépenses déjà importées restent.</div><div class="row2"><button onclick="stmShow('${id}')">Non, garder</button><button class="danger" onclick="stmDelDo('${id}')">Oui, retirer</button></div>`);
}
async function stmDelDo(id){
  const x=stmList().find(s=>s.id===id); if(!x) return;
  data.stm=stmList().filter(s=>s.id!==id); save(); closeModal(); render(); toast('Relevé retiré');
  try{ if(x.asset){ const A=await getAssets(); if(A) await A.delete(x.asset); } else await idbDo('readwrite',o=>o.delete(x.id)); }catch(e){}
}

// relit les relevés gardés pour ajouter ce qu'une ancienne version avait manqué
async function stmResync(){
  let added=0, ch=false;
  for(const st of stmList()){
    if((st.pv||0)>=4 && (st.bk||0)>=2) continue;
    try{ const b=await stmBlob(st); if(!b) continue;
      const ops=await impReadFile(new File([b],st.name,{type:b.type||stmType(st.name)}));
      if((st.bk||0)<2){ const wasAuto=!st.label||st.auto||(ops.bank&&st.label==='Relevé '+ops.bank); st.bk=2; if(wasAuto){ st.label=stmAutoName(ops.bank,ops.to?ops.to.slice(0,7):st.m,ops.no); st.auto=1; } ch=true; }
      if((st.pv||0)>=4) continue;
      // les achats carte étaient rangés au jour d'achat : on les remet à la date du relevé
      const used=new Set();
      ops.filter(o=>o.a<0).forEach(o=>{ const pd=cardDate(o.l,o.d); if(pd===o.d) return; const a=Math.round(-o.a*100)/100, lab=normTxt(o.l).slice(0,30);
        const e=data.exp.find(e=>e.src==='imp'&&!used.has(e.id)&&e.d===pd&&Math.abs(e.a-a)<0.005&&String(e.ik||'').split('|').slice(2).join('|').slice(0,15)===lab.slice(0,15));
        if(e){ used.add(e.id); e.d=o.d; e.pd=pd; e.dfix=2; e.ik=o.d+'|'+a.toFixed(2)+'|'+lab; } });
      ops.forEach(o=>{ o.pd=cardDate(o.l,o.d); });
      const L=impBuild(ops).filter(x=>x.on); L.forEach(impAdd); added+=L.length;
      const I=incBuild(ops); I.forEach(x=>incList().push(x));
      const cnt={}; ops.forEach(o=>{ const m=o.d.slice(0,7); cnt[m]=(cnt[m]||0)+1; }); st.m=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||b.localeCompare(a))[0]||st.m; st.ms=Object.keys(cnt).sort();
      st.chk=impCheck(ops,st.name); st.pv=4; ch=true;
    }catch(e){}
  }
  if(ch){ save(); render(); if(added) toast('✓ '+added+' opération'+(added>1?'s':'')+' ajoutée'+(added>1?'s':'')+' depuis ton relevé'); }
}
/* ---------- Recherche ---------- */
function openSearch(){
  openModal(`<h2>Rechercher</h2><input id="srq" type="search" placeholder="Ex. : Orange, loyer, Carrefour, Canal…" oninput="doSearch()" autocomplete="off" style="margin-top:8px"><div id="srres"><div class="hint">Tape un mot : je cherche dans toutes tes lignes, tous les mois.</div></div><div class="row2"><button onclick="closeModal()">Fermer</button></div>`);
  setTimeout(()=>{ const i=$('#srq'); if(i) i.focus(); },80);
}
function doSearch(){
  const q=normTxt($('#srq').value.trim()), box=$('#srres'); if(!box) return;
  if(q.length<2){ box.innerHTML='<div class="hint">Tape au moins 2 lettres.</div>'; return; }
  const hit=(...t)=>normTxt(t.filter(Boolean).join(' ')).includes(q);
  const L=data.exp.filter(e=>hit(e.n,e.r,catOf(e.c).l)).map(e=>({...e,kind:'exp'})).concat(incList().filter(x=>hit(x.n,x.r)).map(x=>({...x,kind:'inc'}))).sort((a,b)=>b.d.localeCompare(a.d));
  const R=data.rec.filter(r=>hit(r.n,catOf(r.c).l));
  if(!L.length&&!R.length){ box.innerHTML='<div class="empty" style="padding:20px 8px">Rien trouvé.</div>'; return; }
  const out=L.filter(x=>x.kind==='exp'), inn=L.filter(x=>x.kind==='inc'), g={}; L.slice(0,400).forEach(x=>{ (g[x.d.slice(0,7)]=g[x.d.slice(0,7)]||[]).push(x); });
  box.innerHTML=`<div class="card" style="margin-top:10px"><div class="row" style="cursor:default"><div class="ttl"><b>${L.length} ligne${L.length>1?'s':''} trouvée${L.length>1?'s':''}</b><span>${out.length?'Dépensé : '+fmt(sum(out)):''}${out.length&&inn.length?' · ':''}${inn.length?'Reçu : +'+fmt(sum(inn)):''}</span></div><div class="amt">${out.length?'−'+fmt(sum(out)):''}</div></div></div>
    ${R.length?`<div class="hint">🔁 Prélèvement${R.length>1?'s':''} suivi${R.length>1?'s':''} : ${R.map(r=>esc(r.n)+' ('+fmt(r.a)+'/mois)').join(', ')}</div>`:''}
    ${Object.keys(g).sort().reverse().map(m=>{ const o=g[m].filter(x=>x.kind==='exp'); return `<div class="day" style="margin-top:10px"><div class="dayh"><span style="text-transform:none">${esc(monthLabel(m))}</span><b>${o.length?fmt(sum(o)):''}</b></div><div class="card">${g[m].map(x=>{ const c=catOf(x.c), dt=esc(new Date(x.d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}));
      return x.kind==='inc'?`<div class="row" onclick="closeModal(); cur='${m}'; render(); incDel('${x.id}','${m}')"><div class="ico">💰</div><div class="ttl"><b>${esc(x.n)}</b><span>${dt} · Entrée d'argent</span></div><div class="amt" style="color:var(--green)">+${fmt(x.a)}</div></div>`
        :`<div class="row" onclick="closeModal(); cur='${m}'; render(); expTap('${x.id}')"><div class="ico">${c.i}</div><div class="ttl"><b>${esc(x.n||c.l)}</b><span>${dt} · ${esc(c.l)}${payLbl(x)}</span></div><div class="amt">−${fmt(x.a)}</div></div>`; }).join('')}</div></div>`; }).join('')}`;
}

/* ---------- Sauvegarde ---------- */
function blobToB64(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result)); r.onerror=()=>rej(r.error); r.readAsDataURL(b); }); }
async function backupSave(){
  toast('Préparation de la sauvegarde…');
  const files={}; let miss=0;
  for(const st of stmList()){ try{ const b=await stmBlob(st); if(b) files[st.id]=await blobToB64(b); else miss++; }catch(e){ miss++; } }
  const name='depenses-sauvegarde-'+todayStr()+'.json', blob=new Blob([JSON.stringify({app:'depenses', v:2, date:new Date().toISOString(), data, files})],{type:'application/json'});
  if(miss) toast('⚠️ '+miss+' relevé(s) PDF introuvable(s), le reste est sauvegardé');
  try{ const d=window.claude&&claude.use?await claude.use('downloads'):null; if(d){ await d.save({filename:name, data:blob}); bkDone(); toast('✓ Sauvegarde enregistrée'); return; } }catch(e){ if(e&&e.code==='declined') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); bkDone(); toast('✓ Sauvegarde enregistrée'); }catch(e){ toast('Sauvegarde impossible ici'); }
}
let restoreData=null, restoreFiles={};
async function backupLoad(inp){
  const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
  try{ const o=JSON.parse(await f.text()); const d=o&&o.app==='depenses'?o.data:o; if(!d||!Array.isArray(d.exp)) throw 0; restoreData=d; restoreFiles=(o&&o.files)||{}; restoreDate=o.date||'';
    const dt=o.date?new Date(o.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
    openModal(`<h2>Restaurer cette sauvegarde ?</h2><div class="hint">Sauvegarde${dt?' du '+esc(dt):''} : ${d.exp.length} dépense${d.exp.length>1?'s':''}, ${(d.rec||[]).length} prélèvement${(d.rec||[]).length>1?'s':''}${(d.inc||[]).length?', '+d.inc.length+' entrée'+(d.inc.length>1?'s':'')+' d\'argent':''}${Object.keys(restoreFiles).length?', '+Object.keys(restoreFiles).length+' relevé'+(Object.keys(restoreFiles).length>1?'s':'')+' PDF':''}.<br><b style="color:var(--text)">Elle remplace tout ce qu'il y a dans l'appli maintenant.</b></div><div class="row2"><button onclick="closeModal()">Annuler</button><button class="primary" onclick="backupApply()">Restaurer</button></div>`);
  }catch(e){ openModal(`<h2>Fichier non reconnu</h2><div class="hint">Choisis un fichier de sauvegarde « depenses-sauvegarde-….json » créé par l'appli.</div><div class="row2"><button class="primary" onclick="closeModal()">D'accord</button></div>`); }
}
const BK_KEY='depenses_lastbk', BK_DAYS=60; let restoreDate='';
function bkGet(){ try{ const v=localStorage.getItem(BK_KEY); const t=v?new Date(v).getTime():NaN; return isNaN(t)?null:t; }catch(e){ return null; } }
function bkSet(d){ try{ localStorage.setItem(BK_KEY,new Date(d||Date.now()).toISOString()); }catch(e){} }
function bkDone(){ bkSet(); render(); }
function bkDays(){ const t=bkGet(); return t==null?null:Math.floor((Date.now()-t)/86400000); }
function bkLastTxt(){ const t=bkGet(); if(t==null) return 'Aucune sauvegarde faite sur cet appareil pour l\'instant.'; const n=bkDays();
  return 'Dernière sauvegarde : '+new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+(n<=0?' (aujourd\'hui)':n===1?' (hier)':' (il y a '+n+' jours)'); }
function bkBanner(){ if(bkGet()==null&&data.exp.length&&!localStorage.getItem('depenses_bkinit')){ try{ localStorage.setItem('depenses_bkinit','1'); }catch(e){} bkSet(); return ''; } const n=bkDays(); if(n!=null&&n<BK_DAYS) return '';
  return `<div class="bkban"><div><b>💾 Pense à sauvegarder tes données</b><span>${n==null?'Tu n\'as encore jamais sauvegardé sur cet appareil.':'Ta dernière sauvegarde date de '+n+' jours.'} Une sauvegarde tous les 2 mois, c'est plus sûr.</span></div><button onclick="backupSave()">Sauvegarder</button></div>`; }
async function backupApply(){ if(!restoreData) return;
  const nd=Object.assign({v:1,exp:[],rec:[],budget:0,cats:[],paid:{}},restoreData), F=restoreFiles; restoreData=null; restoreFiles={}; bkSet(restoreDate||Date.now());
  closeModal(); toast('Restauration en cours…'); let bad=0;
  for(const st of (Array.isArray(nd.stm)?nd.stm:[])){
    const u=F[st.id]; if(!u) continue;
    try{ const b=await (await fetch(u)).blob(), ty=stmType(st.name)||b.type||'application/pdf', A=await getAssets(); let ok=false;
      if(A&&stmType(st.name)){ try{ const r=await A.upload(new File([b],st.name,{type:ty}),{type:ty}); st.asset=r.id; delete st.local; ok=true; }catch(e){} }
      if(!ok){ await idbDo('readwrite',o=>o.put(b,st.id)); st.local=1; delete st.asset; }
    }catch(e){ bad++; }
  }
  data=nd; save(); render(); toast(bad?'⚠️ Restauré, mais '+bad+' relevé(s) PDF illisible(s)':'✓ Sauvegarde restaurée, relevés compris'); }

let toastT;
function toast(t){ const el=$('#toast'); el.innerHTML='<div class="toast">'+esc(t)+'</div>'; clearTimeout(toastT); toastT=setTimeout(()=>{el.innerHTML='';},2400); }

initStore();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
</script>
